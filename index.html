function tips(p){
  const t = [];

function baseInfo(d){

function barChart(sun, home, title, homeLabel, base){
  const max = Math.max(...sun, ...(home||[]), base||0, 1);
  const top = Math.ceil(max/5)*5;
  const Wd = 640, H = 210, L = 34, R = 8, T = 14, B = 26;
  const cw = (Wd-L-R)/W.length, bw = cw*0.34;
  const y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for (let k=0;k<=4;k++){ const v = top*k/4; g += `<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`; }
  W.forEach((w,i) => {
    const x = L + cw*i + cw/2;
    g += `<rect x="${x-bw-1}" y="${y(sun[i])}" width="${bw}" height="${y(0)-y(sun[i])}" rx="2" fill="var(--accent)"><title>${w} 主日 ${sun[i]} 人</title></rect>`;

function groupView(v){

  h += `<div class="tiles">

  for (const [d, areas] of DGROUPS){

  }
  h += `<div class="panel"><h3>各區比較</h3><div class="tbl"><table><thead><tr><th>區</th><th>名單</th><th>主日平均</th><th>主日 9～11 次</th><th>主日 6～8 次</th><th>主日 3～5 次</th><th>主日 1～2 次</th><th>主日 0 次</th><th>有家聚會</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  h += barChart(W.map((_,i)=>allA.reduce((t,a)=>t+((wk[a]||[])[i]||0),0)), null, `每週主日${G}人數（三個大區合計）`);
  h += `<div class="panel advice"><h3>觀察與建議</h3><ul>${DATA.gadvice[G].map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  h += `<div class="dotkey">每個圓點＝一個主日（深綠＝有來）；上方日期對應每一欄。<b>點任一個名字，可展開他今年每月的主日走勢與 1～8 月家聚會</b></div><div class="row hdr" aria-hidden="true"><div></div><div class="dots">${W.map(w=>`<span>${w}</span>`).join('')}</div><div></div><div></div></div>`;
  const status = p => { const H=p.V+p.O; if(p.S>=9) return ['穩定','p-ok']; if(p.S>=6) return ['接近穩定','p-yel']; if(p.S>=1) return [H?'不穩定':'不穩定・無家聚會','p-org']; return ['有家聚會，未來主日','p-red']; };
  const sec = (label, areas, sub) => {
    const g = ppl.filter(p=>areas.includes(p.a)).sort((a,b)=>(areas.indexOf(a.a)-areas.indexOf(b.a))||(b.S-a.S)||((b.V+b.O)-(a.V+a.O)));
    let s = `<section class="band"><div class="band-head" style="background:var(--accent-soft);border-left:6px solid var(--accent)"><h3>${label}　${g.length} 人</h3></div><div class="rows">`;
    if (!g.length) s += `<div class="empty">這 11 週沒有${G}來主日或有家聚會</div>`;
    for (const p of g){
      const [t,c] = status(p), home = p.V+p.O;
      s += `<div class="row" ${rk(p)}><div class="who"><b>${esc(p.n)}</b>${p.tag?`<span class="chip">${esc(p.tag)}</span>`:''}<span class="chip">${esc(p.r)}</span>${sub?`<span class="chip area">${esc(p.a)}</span>`:''}${MORE}</div>

    }
    return s + '</div></section>';
  };
  for (const [d, areas] of DGROUPS){
    if (d==='二十三大區') areas.forEach(a => h += sec(`${d} · ${a}`, [a], false));
    else h += sec(d, areas, true);
  }
  return h;
}

function sumStat(areas){ const s=[0,0,0,0,0,0]; areas.forEach(a => DATA.areas[a].stat.forEach((v,i)=>s[i]+=v)); return s; }

  for (const [cls,t,d,lo,hi] of bands){

function areaTable(areas, title, withSum){
  let rows = '';

    rows += `<tr><td>${a}</td><td>${s[0]}</td><td>${avg.toFixed(0)}</td><td>${hv.toFixed(0)}</td><td>${s[5]}</td><td class="h57">${s[4]}</td><td class="h24">${s[3]}</td><td class="h1">${s[2]}</td><td>${s[1]}</td></tr>`;
  }
  if (withSum){
    const s = sumStat(areas); const avg = adultWeekly(areas).reduce((p,q)=>p+q,0)/11; const hv = areas.reduce((a,x)=>a+DATA.areas[x].wv.reduce((p,q)=>p+q,0),0)/11;

  return `<div class="panel"><h3>${title}</h3><div class="tbl"><table><thead><tr><th>小區</th><th>名單</th><th>主日平均（扣兒童）</th><th>家聚會平均</th><th>主日 9～11 次</th><th>主日 6～8 次</th><th>主日 3～5 次</th><th>主日 1～2 次</th><th>主日 0 次</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function baptism(){
  const order = {'二十三大區':0,'三十四大區':1,'四十大區':2};
  const list = [...DATA.bap].sort((a,b)=>(order[a.d]-order[b.d])||a.a.localeCompare(b.a)||a.date.localeCompare(b.date));
  const status = p => { const H=p.V+p.O; if(p.S===0&&H===0) return ['完全沒有聚會，立刻探訪','p-red']; if(p.S===0) return ['有家聚會，未來主日','p-org']; if(p.S<=5) return ['不穩定','p-org']; if(p.S<=8) return ['接近穩定','p-yel']; return ['穩定','p-ok']; };
  const red = list.filter(p=>p.S===0&&p.V+p.O===0).length;
  let h = `<div><h2>2026 年受浸者　<span class="sun">主日出席</span></h2><p class="lede">三個大區今年受浸 ${list.length} 位。下列是他們 9/6～11/15 的主日與家聚會情形；虛線圓點是受浸日之前的主日。</p></div>`;
  h += `<div class="tiles">
    <div class="tile cok"><span class="k">主日 9 次以上（穩定）</span><span class="v">${list.filter(p=>p.S>=9).length}<small>人</small></span></div>
    <div class="tile c57"><span class="k">主日 6～8 次</span><span class="v">${list.filter(p=>p.S>=6&&p.S<=8).length}<small>人</small></span></div>

  </div>`;
  h += `<div class="dotkey">每個圓點＝一個主日（深綠＝有來）；上方日期對應每一欄。<b>點任一個名字，可展開他今年每月的主日走勢與 1～8 月家聚會</b></div><div class="row hdr" aria-hidden="true"><div></div><div class="dots">${W.map(w=>`<span>${w}</span>`).join('')}</div><div></div><div></div></div>`;
  const sundays = DATA.sundays;
  for (const [dname] of DGROUPS){
    const sub = list.filter(p=>p.d===dname);
    const zero = sub.filter(p=>p.S===0&&p.V+p.O===0).length;
    h += `<section class="band"><div class="band-head" style="background:var(--accent-soft);border-left:6px solid var(--accent)"><h3>${dname}　受浸 ${sub.length} 位</h3><span>主日 9 次以上 ${sub.filter(p=>p.S>=9).length} 位 · 完全沒有聚會 ${zero} 位</span></div><div class="rows">`;
    if (!sub.length) h += '<div class="empty">今年沒有受浸者</div>';
  for (const p of sub){
    const [st,cls] = status(p); const home=p.V+p.O;
    const d = [...p.s].map((b,i)=> sundays[i] < p.date ? '<i class="pre"></i>' : `<i class="${b==='1'?'on':''}"></i>`).join('');
    h += `<div class="row" ${rk(p)}>
      <div class="who"><b>${esc(p.n)}</b>${p.tag?`<span class="chip">${esc(p.tag)}</span>`:''}<span class="chip">${esc(p.r)}</span><span class="chip area">${esc(p.a)}</span>${MORE}</div>
      <div class="dots">${d}</div>
      <div class="nums"><span>受浸 <b style="font-size:13px">${p.date.slice(5).replace('-','/')}</b></span><span class="sunday">主日 <b>${p.S}</b>/11</span><span class="${home?'':'zero'}">家聚會 <b>${home}</b></span></div>
      <div class="tip"><span class="pill ${cls}">${st}</span></div>
    </div>`;
  }
    h += '</div></section>';
  }
  h += '<p class="note">系統提示有 1 位今年受浸者只登記年份、沒有完整日期，可能沒有列在這裡。</p>';
  return h;

function nBand(S){ if(S>=9) return ['穩定','p-ok']; if(S>=6) return ['接近穩定','p-yel']; if(S>=3) return ['不穩定','p-org']; if(S>=1) return ['需主動聯繫','p-red']; return ['沒有來主日','p-red']; }
function histHTML(p){
  const h = p.h || {s:'0'.repeat(35),V:0,O:0}; const S=[...h.s].filter(b=>b==='1').length, H=h.V+h.O;
  const mon = []; for(let m=0;m<8;m++){ const idx=H35.map((d,i)=>[d,i]).filter(([d])=>d.getMonth()===m).map(([,i])=>i); mon.push([idx.filter(i=>h.s[i]==='1').length, idx.length]); }
  for(const m of [9,10,11]){ const idx=DATA.sundays.map((d,i)=>[+d.slice(5,7),i]).filter(([x])=>x===m).map(([,i])=>i); mon.push([idx.filter(i=>p.s[i]==='1').length, idx.length]); }
  const months = lineChart(mon);
  const eq = Math.round(S*11/35), heq = Math.round(H*11/35), [bt,bc]=hBand(S), [nt,nc]=nBand(p.S);
  const r1=S/35, r2=p.S/11, diff=r2-r1;
  const trend = (S===0&&H===0) ? ['up','1～8 月沒有任何點名紀錄，可能是新朋友或 9 月後才加入名單'] : diff>=0.15 ?['up','9 月以後比 1～8 月更穩定'] : diff<=-0.15 ? ['down','9 月以後比 1～8 月少來，需要關心'] : ['','9 月前後差不多'];
  return `<div class="hist" onclick="event.stopPropagation()">
    ${careEditor(p)}
    <h4>每月主日出席（1 月～11/15）　數字＝該月來了幾次 / 該月有幾個主日</h4>
    ${months}
    <div class="hcmp">
      <div><span class="k">1～8 月主日</span><b>${S}<small style="font-size:12px"> / 35</small></b><span>換算成 11 週約 ${eq} 次</span><span class="pill ${bc}" style="justify-self:start">${bt}</span></div>
      <div><span class="k">1～8 月家聚會</span><b>${H}<small style="font-size:12px"> 次</small></b><span>受訪 ${h.V}・出訪 ${h.O}；換算成 11 週約 ${heq} 次</span></div>
      <div><span class="k">9/6～11/15 主日（對照）</span><b>${p.S}<small style="font-size:12px"> / 11</small></b><span>家聚會 ${p.V+p.O} 次</span><span class="pill ${nc}" style="justify-self:start">${nt}</span></div>
    </div>
    <span class="trend ${trend[0]}">${trend[1]}（1～8 月 ${Math.round(r1*100)}% → 9 月後 ${Math.round(r2*100)}%）</span>
  </div>`;
}
function lineChart(mon){
  const Wd=560, Ht=190, L=34, R=12, T=22, B=30, n=mon.length, cw=(Wd-L-R)/(n-1);
  const x=i=>L+i*cw, y=v=>T+(1-v)*(Ht-T-B);
  const pts=mon.map(([a,b],i)=>[x(i), y(b?a/b:0)]);
  const grid=[0,0.5,1].map(v=>`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v*100}%</text>`).join('');
  const ref=[[9/11,'穩定線'],[6/11,'接近穩定線']].map(([v,t])=>`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><text x="${Wd-R}" y="${y(v)-4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`).join('');
  const shade=`<rect x="${x(7.5)}" y="${T-14}" width="${Wd-R-x(7.5)}" height="${Ht-T-B+14}" fill="var(--accent-soft)" opacity=".55" rx="6"/><text x="${(x(7.5)+Wd-R)/2}" y="${Ht-B-6}" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="700">近 11 週</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dotsv=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${mon[i][0]}/${mon[i][1]}</text>`).join('');
  const xl=mon.map((_,i)=>`<text x="${x(i)}" y="${Ht-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}月</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${Ht}" width="100%" role="img" aria-label="每月主日出席：${mon.map(([a,b],i)=>`${i+1}月 ${a}/${b}`).join('、')}" style="max-width:640px;overflow:visible">${shade}${grid}${ref}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dotsv}${xl}</svg>`;
}

async function saveChk(id, clear){
  const msg = document.getElementById('wm-'+id), ci = document.getElementById('wc-'+id);
  const sel = document.querySelector(`input[name="wr-${id}"]:checked`);
  const code = careCode || (ci ? ci.value.trim() : '');

  if (!code) { msg.textContent = '請輸入填寫密碼（向負責人索取）'; if (ci) ci.focus(); return; }
  const note = clear ? '' : (document.getElementById('wn-'+id).value||'').trim().slice(0,100);
  msg.textContent = '儲存中…';
  try {
    const r = await fetch(SB_URL + '/rpc/set_checkin', {method:'POST', headers:SB_H, body:JSON.stringify({p_id:id, p_week:DATA.week.sunday, p_reason: clear ? '' : sel.value, p_note: note, p_code: code})});
    if (r.status === 401 || r.status === 403) { setCode(''); msg.textContent = '填寫密碼不對，請重新輸入'; return; }
    if (!r.ok) throw new Error(r.status);
    setCode(code);
    if (clear) delete CHK[id]; else CHK[id] = {id, reason: sel.value, note, updated_at: new Date().toISOString()};

  } catch(e) { msg.textContent = '沒有存成功，請檢查網路後再試'; }
}

function drawCard({title, sub, labels, sections, foot}){
  const Wd = 900, sc = 2, RH = 74, F = '"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
  const H = 150 + sections.reduce((s,x)=>s + 56 + Math.max(1,x.rows.length)*RH + 10, 0) + 60;
  const cv = document.createElement('canvas'); cv.width = Wd*sc; cv.height = H*sc;
  const g = cv.getContext('2d'); g.scale(sc, sc);
  const C = {bg:'#f5f7f6', card:'#ffffff', ink:'#1d2a26', mut:'#5f6f69', line:'#dde4e1', acc:'#2f6b57', accs:'#e2efe9', off:'#e3e8e6', red:'#c2413b', reds:'#f8dedc', org:'#e0703a', orgs:'#fbe6dc', yel:'#e9a93b', yels:'#fbf1dc'};
  const T = (x,y,s,sz,col,b,al) => { g.font = `${b?'700 ':''}${sz}px ${F}`; g.fillStyle = C[col]||col; g.textAlign = al||'left'; g.fillText(s, x, y); };
  const RR = (x,y,w,h,r,col) => { g.fillStyle = C[col]||col; g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
  g.fillStyle = C.bg; g.fillRect(0,0,Wd,H);
  RR(0,0,Wd,110,0,'acc'); T(30,50,title,30,'#fff',true); T(30,86,sub,16,'#dcebe4');
  let y = 130;
  T(470, y+6, '', 12, 'mut');
  labels.forEach((l,i) => { if (i===0 || i===labels.length-1 || i%2===0) T(470+i*26, y+4, l, 11, 'mut', false, 'center'); });
  y += 20;
  for (const s of sections) {
    RR(20, y, Wd-40, 40, 8, s.soft||'accs'); RR(20, y, 6, 40, 3, s.color||'acc'); T(38, y+27, s.head, 18, 'ink', true); y += 50;
    if (!s.rows.length) { T(38, y+30, s.empty||'沒有', 15, 'mut'); y += RH; }
    for (const r of s.rows) {
      RR(20, y, Wd-40, RH-8, 8, 'card');
      T(36, y+30, r.n, 21, 'ink', true);
      g.font = `21px ${F}`; let x = 36 + g.measureText(r.n).width + 12; g.font = `700 21px ${F}`; x = Math.max(x, 36 + g.measureText(r.n).width + 12);
      T(x, y+29, r.sub, 14, 'mut');
      [...r.s].forEach((b,i) => { g.fillStyle = b==='1' ? C.acc : C.off; g.beginPath(); g.arc(470+i*26, y+24, 8, 0, 7); g.fill(); if (i===r.s.length-1 && r.ring) { g.strokeStyle = b==='1'?C.acc:C.red; g.lineWidth = 2; g.beginPath(); g.arc(470+i*26, y+24, 11, 0, 7); g.stroke(); } });
      T(Wd-36, y+31, r.right, 20, 'ink', true, 'right');
      if (r.care) T(36, y+56, r.care, 14, r.care.startsWith('未指定') ? 'red' : 'acc', true);
      if (r.status) T(r.care ? 200 : 36, y+56, r.status[0], 14, r.status[1] || 'mut', !!r.status[1]);
      y += RH;
    }
    y += 10;
  }
  T(30, H-24, foot, 13, 'mut');
  return cv;
}
function showShot(cv, name){
  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob), file = new File([blob], name + '.png', {type:'image/png'});
    const canShare = navigator.canShare && navigator.canShare({files:[file]});
    const box = document.createElement('div'); box.className = 'shotbox'; box.setAttribute('role','dialog'); box.setAttribute('aria-label','截圖預覽');
    box.innerHTML = `<div class="shotin"><div class="shotact">${canShare?'<button data-a="share">分享到 LINE 等</button>':''}<button data-a="copy">複製圖片</button><a class="btn" download="${esc(name)}.png" href="${url}">下載</a><button data-a="close" class="ghost">關閉</button></div><p class="note">手機也可以長按圖片，儲存或分享。<span class="smsg"></span></p><img src="${url}" alt="${esc(name)}"></div>`;
    const msg = t => box.querySelector('.smsg').textContent = '　' + t;
    box.addEventListener('click', async e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (e.target === box || a === 'close') { box.remove(); URL.revokeObjectURL(url); return; }
      try {
        if (a === 'share') await navigator.share({files:[file], title:name});
        if (a === 'copy') { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); msg('已複製，可以直接貼到 LINE'); }
      } catch(err) { if (a === 'copy') msg('這個瀏覽器不能直接複製，請按「下載」或長按圖片'); }
    });
    document.body.appendChild(box); box.querySelector('button').focus();
  }, 'image/png');
}

  const ps = REG.filter((p,i,a) => a.findIndex(q => q.id === p.id) === i);
  const B = [['主日 9～11 次　穩定',9,11,'acc','accs'],['主日 6～8 次　接近穩定',6,8,'yel','yels'],['主日 3～5 次　不穩定，需要牧養',3,5,'org','orgs'],['主日 1～2 次　需主動聯繫',1,2,'red','reds'],['主日 0 次',0,0,'red','reds']];
  const sections = B.map(([h,lo,hi,c,s]) => ({head:h, color:c, soft:s, rows: ps.filter(p => p.S>=lo && p.S<=hi).map(p => ({n:p.n, sub:`${p.a} · ${p.r}`, s:p.s, right:`${p.S}/11`, care:careTxt(p.id), status:[`家聚會 ${p.V+p.O}`]}))})).filter(x => x.rows.length);
  showShot(drawCard({title: v.title + '　主日出席', sub: `${DATA.weeks[0]}～${DATA.weeks[10]} 共 11 個主日 · ${ps.length} 位`, labels: DATA.weeks, sections, foot: shotDate()}), v.title);
}
function shotWeekDistrict(dname){
  const W = DATA.week, areas = DGROUPS.find(x => x[0] === dname)[1], sun = md(W.sunday);
  const ps = W.people.filter(p => areas.includes(p.a) && !p.here);
  const row = p => { const c = CHK[p.id]; return {n:p.n, sub:`${p.a} · ${p.r}`, s:p.s, ring:true, right:`${p.S}/11`, care:careTxt(p.id), status: c ? ['✓ 已關心：' + c.reason + (c.note ? '（' + c.note + '）' : ''), 'acc'] : ['尚未確認，請這週關心', 'red']}; };
  const now = areas.reduce((s,a)=>s+((W.areas[a]||{}).now||0),0), avg = areas.reduce((s,a)=>s+((W.areas[a]||{}).avg||0),0);
  showShot(drawCard({title: `${dname}　${sun} 主日需要關心名單`, sub: `本週主日 ${now} 人（近 11 週平均 ${avg}，不含兒童）· 已確認 ${ps.filter(p=>CHK[p.id]).length} / ${ps.length} 位`, labels: W.labels,
    sections: [{head:`接近穩定、${sun} 沒有來（請優先關心）`, color:'red', soft:'reds', rows: ps.filter(p=>p.S<=8).map(row), empty:'沒有，感謝主'},
               {head:`穩定、${sun} 沒有來（問候一下）`, color:'yel', soft:'yels', rows: ps.filter(p=>p.S>=9).map(row)}], foot: shotDate()}), `${dname}_${sun.replace('/','-')}_關心名單`);
}
function shepherds(){
  const m = {}; const P = allPeople();
  for (const [id, c] of Object.entries(CARE)) if (c.who && P[id]) (m[c.who] = m[c.who] || []).push(P[id]);
  return Object.entries(m).sort((a,b) => b[1].length - a[1].length);
}
function shotShepherd(who){
  const ps = (shepherds().find(x => x[0] === who) || [,[]])[1];
  const W = DATA.week, labels = W ? W.labels : DATA.weeks, sun = W ? md(W.sunday) : DATA.weeks[10];
  const rows = ps.map(p => { const s = (W && W.bits[p.id]) || p.s; const here = s[s.length-1] === '1', c = CHK[p.id], S = [...s].filter(b=>b==='1').length;
    return {n:p.n, sub:`${p.a} · ${p.r}`, s, ring:true, right:`${S}/11`, care:'', status: here ? [`${sun} 有來主日`, 'acc'] : c ? ['✓ 已關心：' + c.reason + (c.note ? '（' + c.note + '）' : ''), 'acc'] : [`${sun} 沒有來，請關心`, 'red']}; })
    .sort((a,b) => (a.status[1]==='red') === (b.status[1]==='red') ? 0 : a.status[1]==='red' ? -1 : 1);
  showShot(drawCard({title: `${who} 牧養的聖徒`, sub: `共 ${ps.length} 位 · ${sun} 主日出席與近 11 週情形 · 謝謝你一位一位的關心`, labels, sections:[{head:`我負責的 ${ps.length} 位`, rows}], foot: shotDate()}), `${who}_牧養名單`);
}

/* ---- 牧養聖徒：存在 Supabase（care 表，只存聖徒代號與負責人），兩個版本共用 ---- */
const SB_URL = 'https://jzvfyrimogjyarqhnlrs.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_8xr6DGp1YbcoYjAdmHEkJg_joHiIs7u';
const SB_H = {apikey: SB_KEY, 'Content-Type': 'application/json'};
const CARE = {}; let careDB = null, careReady = false, careErr = '';
let careCode = ''; try { careCode = localStorage.getItem('careCode') || ''; } catch(e) {}
function setCode(c){ careCode = c; try { c ? localStorage.setItem('careCode', c) : localStorage.removeItem('careCode'); } catch(e) {} }
function careEditor(p){
  if (!careDB) return `<div class="cedit"><label>牧養聖徒</label><span class="msg">${careErr || '牧養資料讀取中…'}</span></div>`;
  const c = CARE[p.id];
  const by = c && c.at ? `　最後更新 ${c.at.slice(5,10).replace('-','/')}` : '';
  const codeIn = careCode ? '' : `<input id="cc-${p.id}" type="password" autocomplete="off" placeholder="填寫密碼（第一次需要）" style="max-width:170px">`;
  return `<div class="cedit"><label for="ce-${p.id}">牧養聖徒</label><input id="ce-${p.id}" data-id="${p.id}" maxlength="40" placeholder="填入負責照顧的人" value="${c&&c.who?esc(c.who):''}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveCare('${p.id}')}">${codeIn}<button onclick="saveCare('${p.id}')">儲存</button>${c&&c.who?`<button class="ghost" onclick="saveCare('${p.id}',true)">清除</button>`:''}<span class="msg" id="cm-${p.id}">${by}</span></div>`;
}
async function saveCare(id, clear){
  const inp = document.getElementById('ce-'+id), msg = document.getElementById('cm-'+id), ci = document.getElementById('cc-'+id);
  const code = careCode || (ci ? ci.value.trim() : '');
  if (!code) { if (msg) msg.textContent = '請先輸入填寫密碼（向負責人索取）'; if (ci) ci.focus(); return; }
  const who = clear ? '' : (inp.value||'').trim().slice(0,40);
  if (msg) msg.textContent = '儲存中…';
  try {
    const r = await fetch(SB_URL + '/rpc/set_care', {method:'POST', headers:SB_H, body:JSON.stringify({p_id:id, p_who:who, p_code:code})});
    if (r.status === 403 || r.status === 401) { setCode(''); if (msg) msg.textContent = '填寫密碼不對，請重新輸入'; const row = inp.closest('.row'); const h = row.querySelector('.hist'); if (h) { h.outerHTML = histHTML(REG[+row.dataset.k]); } const m2 = document.getElementById('cm-'+id); if (m2) m2.textContent = '填寫密碼不對，請重新輸入'; const i2 = document.getElementById('ce-'+id); if (i2) i2.value = who; return; }
    if (!r.ok) throw new Error(r.status);
    setCode(code);
    if (who) CARE[id] = {who, at:new Date().toISOString()}; else delete CARE[id];
    paintCare();
    if (clear && inp) inp.value = '';
    if (ci) ci.remove();
    if (msg) msg.textContent = '已儲存，大家重新打開就看得到';
  } catch(e) { if (msg) msg.textContent = '沒有存成功，請檢查網路後再試'; }
}
async function loadCare(){
  try {
    const r = await fetch(SB_URL + '/care?select=id,who,updated_at', {headers:SB_H, cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    for (const k in CARE) delete CARE[k];
    rows.forEach(x => { CARE[x.id] = {who:x.who, at:x.updated_at}; });
    const first = !careDB; careDB = true; careReady = true; careErr = '';
    if (first || (currentId()==='week' && !document.querySelector('.cform'))) { const y = scrollY; render(); scrollTo(0, y); } else paintCare();
  } catch(e) {
    if (!careDB) { careErr = '牧養資料暫時讀不到，請稍後重新整理'; render(); }
  }
}
function paintCare(){
  if (!careDB) return;
  let tot = 0, got = 0;
  document.querySelectorAll('#view .row[data-k]').forEach(row => {
    const p = REG[+row.dataset.k]; const c = CARE[p.id]; const who = c && c.who;
    tot++; if (who) got++;
    row.classList.toggle('has-care', !!who);
    let s = row.querySelector('.who .care');
    if (!s) { s = document.createElement('span'); row.querySelector('.who').appendChild(s); }
    s.className = 'care' + (who ? '' : ' none');
    s.textContent = who ? '牧養：' + who : '未指定牧養';
  });
  const bar = document.getElementById('carebar');
  if (bar) bar.querySelector('.cnt').innerHTML = tot ? `已指定牧養 <b>${got}</b> / ${tot} 位${tot-got?`，還有 <b style="color:var(--g1)">${tot-got}</b> 位沒有確定的人照顧`:'，每一位都有人照顧'}` : '';
}
function careBar(){
  if (currentId()==='overview') return '';
  if (!careDB) return `<div class="carebar"><span class="note">${careErr || '牧養聖徒資料讀取中…'}</span></div>`;
  const only = $('#view').classList.contains('only-none');
  return `<div class="carebar" id="carebar"><span class="cnt"></span><button class="${only?'':'ghost'}" onclick="$('#view').classList.toggle('only-none');render()">${only?'顯示全部':'只看未指定的'}</button><span class="note">點名字即可填寫牧養聖徒</span></div>`;
}
loadCare(); loadChk();
setInterval(() => { if (document.visibilityState === 'visible') { loadCare(); loadChk(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadCare(); loadChk(); } });
function render(){
  REG = [];
  const id = currentId(); const v = VIEWS.find(x=>x.id===id);
  const shotBar = id==='overview' ? '' : `<div class="shotbar"><button onclick="shotPage()">📷 一鍵截圖這頁</button><span class="note">做成一張圖，可傳給負責弟兄</span></div>`;
  $('#view').innerHTML = id==='week' ? weekView() : shotBar + careBar() + (id==='overview' ? overview() : id==='baptism' ? baptism() : v.g ? groupView(v) : districtView(v));
  tabs(); paintCare();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo({top:0}); });
render();
</script>
