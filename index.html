<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>22會所牧養追蹤</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap">
<style>
/* Layout: sticky district tab bar → summary tiles → weekly chart → three attendance bands of member rows with an 11-Sunday dot strip */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --ink:#1d2a26; --muted:#5f6f69; --line:#dde4e1;
  --accent:#2f6b57; --accent-soft:#e2efe9;
  --g57:#e9a93b; --g57-soft:#fbf1dc; --g24:#e0703a; --g24-soft:#fbe6dc; --g1:#c2413b; --g1-soft:#f8dedc;
  --ok:#2f8a5a; --dot-off:#e3e8e6; --bar2:#9bb8ad;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2320; --ink:#e4ece9; --muted:#9aaba5; --line:#2c3833;
  --accent:#7cc3a8; --accent-soft:#20332c;
  --g57:#e9b45a; --g57-soft:#3a3020; --g24:#ec8a5c; --g24-soft:#3b2820; --g1:#e8706a; --g1-soft:#3d2423;
  --ok:#5fc08b; --dot-off:#2b3632; --bar2:#4f6d62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2320; --ink:#e4ece9; --muted:#9aaba5; --line:#2c3833;
  --accent:#7cc3a8; --accent-soft:#20332c;
  --g57:#e9b45a; --g57-soft:#3a3020; --g24:#ec8a5c; --g24-soft:#3b2820; --g1:#e8706a; --g1-soft:#3d2423;
  --ok:#5fc08b; --dot-off:#2b3632; --bar2:#4f6d62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 12px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,34px);margin:0;text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--muted);font-size:13px}
.topic{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.topic-tag{background:var(--accent);color:var(--surface);font-weight:700;font-size:clamp(18px,3vw,22px);padding:4px 14px;border-radius:8px;letter-spacing:.06em}
.topic-sub{font-size:15px;font-weight:500}
h2 .sun{color:var(--accent)}
.nums .sunday{color:var(--accent);font-weight:700}
.nums .sunday b{color:var(--accent);font-size:18px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
nav.tabs .grp{display:flex;gap:4px;align-items:center;flex:none}
nav.tabs .sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
nav.tabs a.sub{font-size:13px;padding:5px 10px}
nav.tabs a:hover{background:var(--accent-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--surface)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-size:24px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:2px 0 0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.tile.c57{border-top:4px solid var(--g57)} .tile.c24{border-top:4px solid var(--g24)} .tile.c1{border-top:4px solid var(--g1)} .tile.cok{border-top:4px solid var(--ok)} .tile.cacc{border-top:4px solid var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.band{display:grid;gap:8px}
.band-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px}
.band-head h3{margin:0;font-size:17px}
.band-head span{font-size:13px;color:var(--muted)}
.band.b57 .band-head{background:var(--g57-soft);border-left:6px solid var(--g57)}
.band.b24 .band-head{background:var(--g24-soft);border-left:6px solid var(--g24)}
.band.b1 .band-head{background:var(--g1-soft);border-left:6px solid var(--g1)}
.rows{display:grid;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:minmax(120px,1.1fr) auto auto minmax(150px,1fr);gap:6px 16px;align-items:center}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.who b{font-size:16px}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.area{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(11,14px);gap:4px}
.dots{display:grid;grid-template-columns:repeat(11,26px);gap:2px;justify-items:center;align-items:center}
.row.hdr{background:transparent;border-color:transparent;padding-block:0}
#fdates{position:fixed;z-index:6;display:none;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:3px 0 4px;box-shadow:0 3px 8px rgba(0,0,0,.12);pointer-events:none}
#fdates span{font-size:10px;color:var(--muted);white-space:nowrap}
.row.hdr .dots span{font-size:10px;color:var(--muted);white-space:nowrap;background:var(--bg);padding:0 1px;border-radius:3px}
nav.tabs .grp + .grp{border-left:1px solid var(--line);padding-left:8px;margin-left:4px}
@media (max-width:919px){
  nav.tabs{position:static}
  nav.tabs .wrap{flex-wrap:wrap;overflow-x:visible;gap:6px;padding-block:8px}
  nav.tabs .grp + .grp{border-left:0;padding-left:0;margin-left:0}
  nav.tabs .grp{gap:4px;flex-wrap:wrap}
  nav.tabs a{padding:4px 10px;font-size:13px;background:var(--bg)}
  nav.tabs a.sub{padding:4px 8px;font-size:12px}
  .g-wk{order:0} .g-ov{order:1} .g-bap{order:2} .g-age{order:3}
  .g-d{order:4;border:1px solid var(--line);border-radius:999px;padding:2px;width:max-content}
  .g-d a:first-child{font-weight:700}
  .row.hdr{grid-template-columns:1fr}
  .row.hdr>div:not(.dots){display:none}
  .row.hdr .dots{grid-column:1 / -1;order:0}
  header.top{padding-block:14px 6px}
  header.top h1{font-size:21px}
  .topic{margin-top:6px;gap:6px}
  .topic-tag{font-size:14px;padding:2px 10px}
  .topic-sub{font-size:12px}
  header.top p{display:none}
}
@media (min-width:920px){.row{grid-template-columns:200px 306px 270px minmax(0,1fr)}}.dots i{width:14px;height:14px;border-radius:50%;background:var(--dot-off)}
.dots i.on{background:var(--accent)}
.dots i.pre{background:transparent;border:1px dashed var(--line)}
.row[data-k]{cursor:pointer}
.row[data-k]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{font-size:11px;color:var(--accent);white-space:nowrap;font-weight:700}
.row[aria-expanded="true"] .more::after{content:" ▴"} .row[aria-expanded="false"] .more::after{content:" ▾"}
.hist{grid-column:1 / -1;order:9;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px;display:grid;gap:10px;cursor:default}
.hist h4{margin:0;font-size:13px;color:var(--muted);font-weight:700}
.hm{display:flex;flex-wrap:wrap;gap:6px 12px}
.hm div{display:flex;flex-direction:column;gap:3px}
.hm span{font-size:10px;color:var(--muted)}
.hm p{display:flex;gap:3px;margin:0}
.hm i{width:11px;height:11px;border-radius:50%;background:var(--dot-off);display:block}
.hm i.on{background:var(--accent)}
.hcmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.hcmp div{background:var(--bg);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:13px}
.hcmp b{font-size:18px}
.hcmp .k{font-size:11px;color:var(--muted)}
.care{font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--accent);color:var(--accent);font-weight:700}
.care.none{border-color:var(--g1);color:var(--g1);border-style:dashed;font-weight:500}
.cedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px}
.cedit label{font-weight:700}
.cedit input{font:inherit;font-size:15px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 160px;max-width:260px}
.cedit button,.carebar button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.cedit button.ghost,.carebar button.ghost{background:transparent;color:var(--accent)}
.cedit .msg{font-size:12px;color:var(--muted)}
.cbtn{font:inherit;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;min-height:26px}
.wcare{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.wcare .cedit{flex:1 1 auto}
.wcare>button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.subhead{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:20px 0 4px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);border-left:4px solid var(--accent)}
.subhead h4{margin:0;font-size:16px}
.carebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.carebar b{font-size:15px}
#view.only-none .row[data-k].has-care{display:none}
nav.tabs .g-wk a{font-weight:700;color:var(--g1)}
nav.tabs .g-wk a[aria-current="page"]{color:#fff;background:var(--g1)}
.howto{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:12px 16px;display:grid;gap:6px;font-size:14px}
.howto h3{margin:0;font-size:16px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:3px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:8px}
.wrow.done{border-color:var(--ok);background:var(--accent-soft)}
.wtop{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.wtop .who{flex:1 1 220px}
.wdots{display:flex;gap:3px;align-items:center}
.wdots i{width:12px;height:12px;border-radius:50%;background:var(--dot-off);display:block}
.wdots i.on{background:var(--accent)}
.wdots i.now{outline:2px solid var(--g1);outline-offset:1px}
.wdots i.now.on{outline-color:var(--accent)}
.wmeta{font-size:13px;color:var(--muted);white-space:nowrap}
.wmeta b{color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.chk .ok{color:var(--ok);font-weight:700}
.chk button,.cform button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.chk button.ghost,.cform button.ghost{background:transparent;color:var(--accent)}
.cform{display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:10px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons label{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.reasons input{position:absolute;opacity:0;pointer-events:none}
.reasons label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#fff}
.reasons label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.cform input[type=text],.cform input[type=password]{font:inherit;font-size:15px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.cform .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#view.only-open .wrow.done{display:none}
.wsec{display:grid;gap:8px}
.wsec h4{margin:6px 0 0;font-size:15px}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--accent-soft)}
.shotbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shotbar button,.shotbtn,.shepbtn,.shotact button,.shotact .btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap}
.shotbtn{margin-left:auto;font-size:13px;padding:4px 12px}
.shepbtn{background:var(--surface);color:var(--accent);font-size:13px}
.shotact button.ghost{background:transparent;color:var(--accent)}
.shotbox{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.shotin{background:var(--surface);border-radius:12px;padding:12px;max-width:min(920px,100%);display:grid;gap:8px}
.shotin img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.shotact{display:flex;gap:8px;flex-wrap:wrap}
.trend{font-size:13px;font-weight:700}
.trend.up{color:var(--ok)} .trend.down{color:var(--g1)}
.nums{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.nums b{color:var(--ink);font-size:16px}
.nums .zero b{color:var(--g1)}
.tip{font-size:13px;color:var(--ink);display:flex;gap:6px;flex-wrap:wrap}
.tip span{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.tip span.warn{border-color:var(--g1);color:var(--g1)}
.empty{color:var(--muted);font-size:14px;padding:6px 14px}
.dotkey{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dotkey .dots{grid-template-columns:repeat(11,14px)}
.dotkey .dots span{font-size:9px;text-align:center;color:var(--muted);width:14px;overflow:visible;white-space:nowrap}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td:first-child,th:first-child{text-align:left}
tr.sum td{font-weight:700;background:var(--accent-soft)}
td.h57{background:var(--g57-soft)} td.h24{background:var(--g24-soft)} td.h1{background:var(--g1-soft)}
.advice{display:grid;gap:14px}
.advice section{display:grid;gap:6px}
.advice h4{margin:0;font-size:15px;color:var(--accent)}
.advice ul{margin:0;padding-left:1.2em;display:grid;gap:4px;max-width:70ch}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.p-red{background:var(--g1-soft);color:var(--g1)} .pill.p-org{background:var(--g24-soft);color:var(--g24)} .pill.p-yel{background:var(--g57-soft);color:#9a6a12} .pill.p-ok{background:var(--accent-soft);color:var(--ok)}
:root[data-theme="dark"] .pill.p-yel{color:var(--g57)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.p-yel{color:var(--g57)}}
.note{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media (max-width:919px){
  .row{grid-template-columns:1fr auto}
  .row .dots{grid-column:1 / -1;order:3}
  .row .tip{grid-column:1 / -1;order:4}
}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}.row:hover{border-color:var(--accent)}}
.wkg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.wkg button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;min-height:36px}
.wkg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.thm{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.thm button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer;min-height:32px}
.thm button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.gate{display:flex;justify-content:center;padding:40px 16px 80px}
.gate[hidden]{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px;width:100%;display:grid;gap:10px}
.gbox h2{font-size:20px}
.gbox input{font:inherit;font-size:20px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);letter-spacing:.2em}
.gbox button{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);font-weight:700;cursor:pointer}
.gmsg{margin:0;color:var(--g1);font-size:14px;min-height:1.4em}
.srch{position:relative;margin-top:10px;max-width:420px}
.srch[hidden]{display:none}
.srch input{width:100%;font:inherit;font-size:15px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.qres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:60vh;overflow:auto;display:none}
.qres.on{display:block}
.qres button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}

function paintTheme(){ document.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === curTheme())); }
function setTheme(t){
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  try { t === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', t); } catch(e) {}
  paintTheme();
}

function barChart(sun, home, title, homeLabel, base){
  const max = Math.max(...sun, ...(home||[]), base||0, 1);
  const top = Math.ceil(max/5)*5;
  const Wd = 640, H = 210, L = 34, R = base ? 58 : 8, T = 14, B = 26;
  const cw = (Wd-L-R)/W.length, bw = cw*0.34;
  const y = v => T + (H-T-B)*(1 - v/top);
  let g = '';
  for (let k=0;k<=4;k++){ const v = top*k/4; g += `<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`; }
  W.forEach((w,i) => {
    const x = L + cw*i + cw/2;
    g += `<rect x="${x-bw-1}" y="${y(sun[i])}" width="${bw}" height="${y(0)-y(sun[i])}" rx="2" fill="var(--accent)"><title>${w} 主日 ${sun[i]} 人</title></rect>`;
    if (home) g += `<rect x="${x+1}" y="${y(home[i])}" width="${bw}" height="${y(0)-y(home[i])}" rx="2" fill="var(--bar2)"><title>${w} ${homeLabel} ${home[i]} 人</title></rect>`;
    g += `<text x="${x-bw/2-1}" y="${y(sun[i])-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${sun[i]}</text>`;
    g += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${w}</text>`;
  });
  if (base) g += `<line x1="${L}" x2="${Wd-R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--g24)" stroke-width="2" stroke-dasharray="6 4"/><text x="${Wd-R+6}" y="${y(base)+4}" text-anchor="start" font-size="12" font-weight="700" fill="var(--g24)">基數 ${base}</text>`;
  return `<div class="panel chart"><h3>${title}</h3><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${title}">${g}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>主日出席</span>${home?`<span><i style="background:var(--bar2)"></i>${homeLabel}</span>`:''}<span>${W[W.length-1]} 可能尚未補點完畢</span></div></div>`;
}

  return h;

/* 0 次、也沒有家聚會的人：收合，用小標籤列名字，依小區分組，不佔版面 */

function districtView(v){

function drawCard({title, sub, labels, sections, foot}){
  const Wd = 900, sc = 2, RH = 74, F = '"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
  const H = 150 + sections.reduce((s,x)=>s + 56 + Math.max(1,x.rows.length)*RH + 10, 0) + 60;
  const cv = document.createElement('canvas'); cv.width = Wd*sc; cv.height = H*sc;
  const g = cv.getContext('2d'); g.scale(sc, sc);
  const C = {bg:'#f5f7f6', card:'#ffffff', ink:'#1d2a26', mut:'#5f6f69', line:'#dde4e1', acc:'#2f6b57', accs:'#e2efe9', off:'#e3e8e6', red:'#c2413b', reds:'#f8dedc', org:'#e0703a', orgs:'#fbe6dc', yel:'#e9a93b', yels:'#fbf1dc'};
  const T = (x,y,s,sz,col,b,al) => { g.font = `${b?'700 ':''}${sz}px ${F}`; g.fillStyle = C[col]||col; g.textAlign = al||'left'; g.fillText(s, x, y); };
  const RR = (x,y,w,h,r,col) => { g.fillStyle = C[col]||col; g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
  g.fillStyle = C.bg; g.fillRect(0,0,Wd,H);
  RR(0,0,Wd,110,0,'acc'); T(30,50,title,30,'#fff',true); T(30,86,sub,16,'#dcebe4');
  let y = 130;
  T(470, y+6, '', 12, 'mut');
  labels.forEach((l,i) => { if (i===0 || i===labels.length-1 || i%2===0) T(470+i*26, y+4, l, 11, 'mut', false, 'center'); });
  y += 20;
  for (const s of sections) {
    RR(20, y, Wd-40, 40, 8, s.soft||'accs'); RR(20, y, 6, 40, 3, s.color||'acc'); T(38, y+27, s.head, 18, 'ink', true); y += 50;
    if (!s.rows.length) { T(38, y+30, s.empty||'沒有', 15, 'mut'); y += RH; }
    for (const r of s.rows) {
      RR(20, y, Wd-40, RH-8, 8, 'card');
      T(36, y+30, r.n, 21, 'ink', true);
      g.font = `21px ${F}`; let x = 36 + g.measureText(r.n).width + 12; g.font = `700 21px ${F}`; x = Math.max(x, 36 + g.measureText(r.n).width + 12);
      T(x, y+29, r.sub, 14, 'mut');
      [...r.s].forEach((b,i) => { g.fillStyle = b==='1' ? C.acc : C.off; g.beginPath(); g.arc(470+i*26, y+24, 8, 0, 7); g.fill(); if (i===r.s.length-1 && r.ring) { g.strokeStyle = b==='1'?C.acc:C.red; g.lineWidth = 2; g.beginPath(); g.arc(470+i*26, y+24, 11, 0, 7); g.stroke(); } });
      T(Wd-36, y+31, r.right, 20, 'ink', true, 'right');
      if (r.care) T(36, y+56, r.care, 14, r.care.startsWith('未指定') ? 'red' : 'acc', true);
      if (r.status) T(r.care ? 200 : 36, y+56, r.status[0], 14, r.status[1] || 'mut', !!r.status[1]);
      y += RH;
    }
    y += 10;
  }
  T(30, H-24, foot, 13, 'mut');
  return cv;
}

  dl.innerHTML = [...new Set(Object.values(CARE).map(c => c.who).filter(Boolean))].map(w => `<option value="${esc(w)}">`).join('');
  applyFilter();
}

/* ---- 全站搜尋姓名：點結果跳到那個人所在的小區頁並展開 ---- */
const AREA_VIEW = {'大里':'d23-dali','內新':'d23-neixin','德芳':'d23-defang','新里':'d23-xinli','仁化':'d34','草湖':'d34','宜欣':'d40','太平':'d40','四十大區(直屬)':'d40'};

  const hits = [...DATA.people, ...DATA.gpeople].filter(p => p.n.includes(q)).sort((a,b)=>(a.n.indexOf(q)-b.n.indexOf(q))||(b.S-a.S)).slice(0, 30);

function goPerson(id, view){

/* ---- 進站密碼：資料是加密的，密碼對了才解得開；同一個密碼也拿來填牧養、回報關心 ---- */
async function unlock(pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.it, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, key, b(ENC.ct))));
}
/* 往下捲時，圓點上方的日期跟著浮在畫面頂端，對齊目前看到的那幾列 */
function initFloatDates(){
  const fd = document.createElement('div'); fd.id = 'fdates'; fd.className = 'dots'; fd.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fd);
  let busy = false, built = '';
  const upd = () => {
    busy = false;
    const lbl = W.join(','); if (built !== lbl) { fd.innerHTML = W.map(w => `<span>${w}</span>`).join(''); built = lbl; }
    // 頂端被固定住的東西（分頁列、篩選列）下面才是浮動日期的位置
    let top = 0;
    document.querySelectorAll('nav.tabs, .fbar').forEach(el => {
      if (!el.offsetParent || getComputedStyle(el).position !== 'sticky') return;
      const r = el.getBoundingClientRect(), st = parseFloat(getComputedStyle(el).top) || 0;
      if (r.top <= st + 1 && r.bottom > top) top = r.bottom;
    });
    const hdr = [...document.querySelectorAll('.row.hdr')].find(h => h.offsetParent);
    let show = false, ref = null;
    if (hdr && hdr.getBoundingClientRect().bottom < top + 2) {
      ref = [...document.querySelectorAll('.row:not(.hdr) > .dots')].find(d => { if (!d.offsetParent) return false; const r = d.getBoundingClientRect(); return r.bottom > top + 4 && r.top < innerHeight; });
      show = !!ref;
    }
    if (!show) { fd.style.display = 'none'; return; }
    const r = ref.getBoundingClientRect();
    fd.style.display = 'grid'; fd.style.top = top + 'px'; fd.style.left = (r.left - 5) + 'px'; fd.style.paddingInline = '4px';
  };
  const req = () => { if (!busy) { busy = true; requestAnimationFrame(upd); } };
  addEventListener('scroll', req, {passive: true}); addEventListener('resize', req);
  new MutationObserver(req).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'open', 'class']});
  req();
}
/* ---- 加到手機主畫面：Android 的 Chrome 一鍵安裝；iPhone 不能一鍵，改成看圖照步驟 ---- */
const A2HS = { ok: !!document.querySelector('link[rel="manifest"]'), evt: null };   // 只有 GitHub 版有 manifest
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let a2hsHide = false; try { a2hsHide = localStorage.getItem('a2hsHide') === '1'; } catch(e) {}
if (A2HS.ok && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); A2HS.evt = e; });
addEventListener('appinstalled', () => { A2HS.evt = null; hideA2hs(); });
const showA2hs = () => A2HS.ok && !isStandalone();
const A2HS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 8v7"/><path d="m8.5 11.5 3.5 3.5 3.5-3.5"/><path d="M10.5 18.5h3"/></svg>';
function a2hsBanner(){
  if (!showA2hs() || a2hsHide) return '';
  return `<div class="a2hs"><span class="aic">${A2HS_ICON}</span><div class="atx"><b>加到手機主畫面</b><small>以後像 App 一樣，點圖示就打開</small></div><button class="ago" onclick="addHome()">加入</button><button class="ax" onclick="hideA2hs()" aria-label="不要再顯示這個提示">✕</button></div>`;
}
function hideA2hs(){ a2hsHide = true; try { localStorage.setItem('a2hsHide', '1'); } catch(e) {} document.querySelectorAll('.a2hs').forEach(x => x.remove()); }
async function addHome(){
  if (A2HS.evt) {                                   // Android Chrome：直接跳出安裝視窗
    A2HS.evt.prompt();
    const r = await A2HS.evt.userChoice.catch(() => null); A2HS.evt = null;
    if (r && r.outcome === 'accepted') hideA2hs();
    return;
  }
  const ua = navigator.userAgent;
  const share = '<svg class="ish" viewBox="0 0 24 24" aria-label="分享"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  let title, steps;
  if (/Line\/|FBAN|FBAV|Instagram/i.test(ua)) {
    title = '請先換用手機的瀏覽器打開';
    steps = ['在 LINE 裏面不能加到主畫面。', '按右上角的「⋮」或「⋯」。', '選「<b>用預設瀏覽器開啟</b>」（iPhone 是 Safari，Android 是 Chrome）。', '打開後，再按一次「加到手機主畫面」。'];
  } else if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    title = 'iPhone 加到主畫面（3 步）';
    steps = [`按畫面下方（或網址列旁）的「<b>分享</b>」按鈕 ${share}`, '往下滑，按「<b>加入主畫面</b>」。', '右上角按「<b>新增</b>」。主畫面就會出現綠色愛心的「牧養追蹤」。'];
  } else {
    title = 'Android 加到主畫面（3 步）';
    steps = ['按 Chrome 右上角的「<b>⋮</b>」。', '按「<b>加到主畫面</b>」或「<b>安裝應用程式</b>」。', '再按「<b>安裝</b>」或「<b>新增</b>」。主畫面就會出現綠色愛心的「牧養追蹤」。'];
  }
  const box = document.createElement('div'); box.className = 'shotbox';
  box.innerHTML = `<div class="shotin a2box" role="dialog" aria-label="${title}"><h3>${title}</h3><ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol><div class="shotact"><button onclick="this.closest('.shotbox').remove()">我知道了</button></div></div>`;
  box.addEventListener('click', e => { if (e.target === box) box.remove(); });
  document.body.appendChild(box);
}
function boot(d, pw){
  DATA = d; W = DATA.weeks;
  try { localStorage.setItem('sitePw', pw); } catch(e) {}
  if (careCode !== pw) setCode(pw);          // 填牧養、回報關心用同一個密碼，不用再輸入
  $('#gate').hidden = true; $('#srch').hidden = false; $('#bnav').hidden = false;
  $('#bsearch').addEventListener('click', () => { scrollTo({top: 0}); setTimeout(() => $('#q').focus(), 150); });
  render();
  initFloatDates();
  loadCare(); loadChk();
  setInterval(() => { if (document.visibilityState === 'visible') { loadCare(); loadChk(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadCare(); loadChk(); } });
}
(async () => {
  const gate = $('#gate'), msg = $('#gmsg');
  if (!window.crypto || !crypto.subtle) { gate.hidden = false; msg.textContent = '這個瀏覽器不支援加密，請改用 Chrome、Safari 或 LINE 外部瀏覽器開啟。'; return; }
  let saved = ''; try { saved = localStorage.getItem('sitePw') || ''; } catch(e) {}
  if (saved) { try { return boot(await unlock(saved), saved); } catch(e) {} }
  gate.hidden = false; $('#gpw').focus();
  $('#gform').addEventListener('submit', async e => {
    e.preventDefault(); const pw = $('#gpw').value.trim(); if (!pw) return;
    msg.textContent = '確認中…';
    try { boot(await unlock(pw), pw); } catch(err) { msg.textContent = '密碼不對，請再試一次'; $('#gpw').select(); }
  });
})();
</script>
